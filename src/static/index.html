<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAS Downloader</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-inner">
                <div class="logo">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>NAS Downloader</span>
                </div>
                <div class="header-actions">
                    <span class="status-indicator">
                        <span class="dot" id="status-dot"></span>
                        <span id="status-text">Connexion…</span>
                    </span>
                    <button class="btn btn-icon" id="refresh-btn" title="Actualiser">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <polyline points="1 20 1 14 7 14"/>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="main">

            <!-- Formulaire d'ajout -->
            <section class="card">
                <h2 class="card-title">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    Ajouter via fichier .torrent
                </h2>
                <form id="add-form" class="add-form" enctype="multipart/form-data">
                    <input type="file" id="torrent-input" name="torrent" accept=".torrent" multiple hidden>
                    <div class="field-row">
                        <label class="field-label" for="destination-select">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            Destination
                        </label>
                        <select id="destination-select" name="destination" class="select-input">
                            <option value="">Chargement…</option>
                        </select>
                    </div>
                    <div class="file-zone" id="file-zone">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="12" y1="18" x2="12" y2="12"/>
                            <line x1="9" y1="15" x2="15" y2="15"/>
                        </svg>
                        <span id="file-label">Cliquer ou glisser un ou plusieurs fichiers <strong>.torrent</strong></span>
                        <span class="file-hint">Les fichiers seront débridés via AllDebrid puis ajoutés au NAS</span>
                    </div>
                    <div class="add-row" id="add-row" hidden>
                        <div id="file-list" class="file-list"></div>
                        <div class="add-actions">
                            <button type="button" class="btn btn-ghost-sm" id="clear-btn">Annuler</button>
                            <button type="submit" class="btn btn-primary" id="add-btn">
                                <span class="btn-text">Débrider &amp; Envoyer au NAS</span>
                                <span class="btn-loader" hidden>
                                    <span class="spinner"></span>
                                    <span id="loader-msg">0 / 0</span>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div id="add-feedback" class="feedback" hidden></div>
                </form>
            </section>

            <!-- Liste des téléchargements -->
            <section class="card">
                <div class="section-header">
                    <h2 class="card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"/>
                            <line x1="8" y1="12" x2="21" y2="12"/>
                            <line x1="8" y1="18" x2="21" y2="18"/>
                            <line x1="3" y1="6" x2="3.01" y2="6"/>
                            <line x1="3" y1="12" x2="3.01" y2="12"/>
                            <line x1="3" y1="18" x2="3.01" y2="18"/>
                        </svg>
                        Téléchargements
                        <span class="badge" id="task-count">0</span>
                    </h2>
                    <button class="btn btn-danger-outline" id="delete-finished-btn" title="Supprimer toutes les tâches terminées">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            <path d="M10 11v6M14 11v6"/>
                        </svg>
                        Supprimer les terminés
                    </button>
                </div>

                <div id="state-loading" class="state-box">
                    <div class="spinner large"></div>
                    <p>Chargement…</p>
                </div>

                <div id="state-empty" class="state-box" hidden>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <p>Aucun téléchargement en cours</p>
                </div>

                <div id="state-error" class="state-box state-error" hidden>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <p id="state-error-msg">Erreur de connexion</p>
                </div>

                <table class="tasks-table" id="tasks-table" hidden>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Taille</th>
                            <th>Statut</th>
                            <th class="col-speed">Vitesse</th>
                            <th>Progression</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tasks-body"></tbody>
                </table>
            </section>

        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
